name: Sincronização PNCP

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pncp-sync-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Disparar lote PNCP
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "${CRON_SECRET}" ]]; then
            echo "::error::Repository secret CRON_SECRET não configurado."
            exit 1
          fi

          # Sem verbose, corpo de resposta, redirects ou retries adicionais.
          # O próximo disparo retoma o checkpoint persistido pelo endpoint.
          curl_exit=0
          http_status=$(curl --silent --output /dev/null \
            --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 70 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            'https://oportuna-two.vercel.app/api/cron/pncp') || curl_exit=$?

          # Um 4xx recebido continua sendo erro mesmo se a leitura expirar depois.
          case "${http_status}" in
            4??)
              echo "::error::PNCP retornou HTTP ${http_status}; revisar autorização/configuração."
              exit 1
              ;;
          esac

          if [[ "${curl_exit}" -ne 0 ]]; then
            echo "::warning::Falha de transporte/timeout (curl ${curl_exit}); nova tentativa no próximo disparo."
            exit 0
          fi

          case "${http_status}" in
            200)
              echo "Lote PNCP concluído: HTTP 200."
              ;;
            5??)
              echo "::warning::PNCP retornou HTTP ${http_status}; nova tentativa no próximo disparo."
              ;;
            *)
              echo "::error::Resposta HTTP inesperada: ${http_status}."
              exit 1
              ;;
          esac

  recuperar-concessoes:
    # Compartilha o disparo existente; habilitar somente após homologação conjunta.
    # Não depende do resultado do job PNCP e não repete eventos/pagamentos.
    if: github.ref == 'refs/heads/main' && vars.FINANCEIRO_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Recuperar lote de concessões financeiras
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RECOVERY_URL: ${{ vars.FINANCEIRO_RECOVERY_URL }}
        run: |
          if [[ -z "${CRON_SECRET}" || "${RECOVERY_URL}" != https://*/api/cron/concessoes-financeiras ]]; then
            echo "::error::Configuração da recuperação financeira ausente ou inválida."
            exit 1
          fi
          # Sem corpo/log de credenciais, redirecionamentos ou retries.
          curl_exit=0
          http_status=$(curl --silent --output /dev/null \
            --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 70 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${RECOVERY_URL}") || curl_exit=$?
          if [[ "${curl_exit}" -ne 0 || "${http_status}" != 200 ]]; then
            echo "::error::Recuperação financeira incompleta (HTTP ${http_status}, curl ${curl_exit}); conferir logs e outbox."
            exit 1
          fi
          echo "Lote de concessões financeiras concluído: HTTP 200."
